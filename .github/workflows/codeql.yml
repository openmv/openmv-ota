name: CodeQL

# Static analysis (the security-extended query suite) over the host tools, the server, the
# device runtime, and the ECDSA C shim. Findings land in the repo's Security tab; a new
# high-severity alert on a PR shows as a failed check.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"          # weekly, so new queries catch old code too
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # c-cpp builds nothing: the shim needs the firmware's mbedtls tree, and build-mode none
        # analyzes the source without it
        language: [python, c-cpp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52  # v3.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52  # v3.38.2
        with:
          category: /language:${{ matrix.language }}
