name: HIL OTA cycle

# The live-hardware OTA gate: provision a golden board from this ref, exercise an OTA
# SCENARIO (happy install/trial/confirm/promote, or a negative path -- corrupt, rollback,
# bad signature), and verify the device behaves, capturing the coverage markers off the
# board's P4/P5 UART. A second job folds the traces into a device-path coverage report --
# coverage on the lines the host suite structurally can't reach (they need real flash).
#
# REQUIRED GATE for OTA-touching PRs, robust by construction:
#   * The workflow triggers on EVERY pull request, but the bench jobs only run when the PR
#     changes device behaviour -- the `changes` job detects that (device runtime + installer +
#     boot.py, the firmware/romfs build, the project lock, or the HIL harness). A docs/server/
#     host-test-only PR runs nothing on the bench, so the single physical boards aren't tied up.
#   * `hil-gate` ALWAYS runs (a hosted-runner shim) and is THE check to mark "required" in branch
#     protection. It passes a non-device PR instantly and blocks a device PR unless every bench
#     leg succeeded. This is why the workflow can't just `paths`-filter its trigger: a required
#     check that never runs (filtered out) leaves a PR stuck on a forever-pending check -- the
#     classic trap. Running always + gating inside + a shim status is the robust shape.
#   * Path detection SAFE-DEFAULTS TO RUN: if the diff can't be computed, the gate runs rather
#     than skips, so a detection glitch can never wave a breaking change through.
# `workflow_dispatch` is kept for running a chosen board/scenario by hand (debugging one leg, or
# exercising the AE3, which PR runs leave out while its USB/DFU is hardware-debugged). No nightly:
# PRs cover main before every merge, so a schedule would only re-prove merged code and needlessly
# contend the boards. The coverage fold + Codecov upload run with `if: always()`, so a flaky leg
# still publishes what the healthy boards proved.
#
# TO ARM THE GATE: in branch protection for the default branch, add the "HIL gate" status check to
# "Require status checks to pass before merging". That one check is sufficient (and correct for
# non-device PRs); do NOT mark the individual `ota-cycle ...` legs required -- they don't run on
# every PR, so marking them required would re-introduce the forever-pending trap.
on:
  workflow_dispatch:
    inputs:
      board:
        description: which board to run (or all)
        default: all
        type: choice
        options: [all, OPENMV_N6, OPENMV_AE3, OPENMV_RT1060, OPENMV4P, ARDUINO_NICLA_VISION, ARDUINO_PORTENTA_H7]
      scenario:
        description: which OTA path to exercise ('all' = each board's full regression)
        default: all
        type: choice
        # Every run spins up its OWN co-located server (ci/hil/bench_server), so the tamper
        # scenarios run on any board -- no board restriction. 'all' expands per board (the
        # AE3 adds coproc/coproc_skip; block-device boards add no_slot; secondary nets = delta).
        options: [all, delta, full, corrupt, rollback, bad_sig, bad_key, bad_version, no_slot, coproc, coproc_skip, watchdog, watchdog_bite]
      target:
        description: update version to install over golden 1.0.0
        default: "1.1.0"
  # Every PR: the `changes` job below decides whether the bench work actually runs, so the
  # required `hil-gate` check exists on every PR (never a forever-pending required check).
  pull_request:

concurrency:
  group: hil-ota-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENMV_REF: master        # firmware ref the runner-owned provision builds (as ci.yml)

jobs:
  # Does this PR touch anything that can change device behaviour? Self-contained (a git diff, no
  # third-party action) and auditable. SAFE DEFAULT: on any doubt (non-PR event, or a diff that
  # can't be computed) -> device=true, so the gate RUNS rather than silently skips.
  changes:
    name: detect device-path changes
    runs-on: ubuntu-latest
    outputs:
      device: ${{ steps.d.outputs.device }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # need the base commit reachable for the diff
      - id: d
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          if [ "$EVENT" != "pull_request" ]; then
            echo "non-PR event ($EVENT) -> device=true (run)"; echo "device=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! changed=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null); then
            echo "diff ($BASE...$HEAD) failed -> device=true (safe default: run)"; echo "device=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf 'changed files:\n%s\n' "$changed"
          # The paths that change what lands on the device or how the cycle is exercised: the
          # device runtime + installer + boot.py, the firmware/romfs build, the project lock (the
          # #19348 firmware features), and the HIL harness itself.
          if printf '%s\n' "$changed" | grep -qE '^(src/openmv_ota/build/|src/openmv_ota/project/|ci/hil/|\.github/workflows/hil-ota\.yml$)'; then
            echo "device paths changed -> device=true"; echo "device=true" >> "$GITHUB_OUTPUT"
          else
            echo "no device paths changed -> device=false (skip bench, gate passes)"; echo "device=false" >> "$GITHUB_OUTPUT"
          fi

  # Resolve which board/network legs to run from the `board` input. A job-level `if` can't see
  # `matrix` (that context isn't available there -- it was an invalid-workflow error), and a
  # static matrix can't be filtered inline, so build the matrix here and feed it via fromJSON.
  plan:
    name: plan legs
    needs: changes
    if: needs.changes.outputs.device == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.f.outputs.matrix }}
    steps:
      - id: f
        env:
          BOARD: ${{ github.event.inputs.board }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          # The N6 and RT1062 have both interfaces, so each runs twice (lan + wifi). The RT1062
          # is the block-device (mimxrt) model, provisioned via blhost (machine.bootloader ->
          # resident SBL); its runner label is board-openmv-rt1062 (RT1062 silicon), as in ci.yml.
          legs = [
              {"board": "OPENMV_N6", "network": "lan", "label": "board-openmv-n6"},
              {"board": "OPENMV_N6", "network": "wifi", "label": "board-openmv-n6"},
              {"board": "OPENMV_AE3", "network": "wifi", "label": "board-openmv-ae3"},
              {"board": "OPENMV_RT1060", "network": "lan", "label": "board-openmv-rt1062"},
              {"board": "OPENMV_RT1060", "network": "wifi", "label": "board-openmv-rt1062"},
              # H7 Plus: wifi-only (ATWINC1500 shield); golden flash via OpenMV DFU (same CLI as N6).
              {"board": "OPENMV4P", "network": "wifi", "label": "board-openmv-h7-plus"},
              # Arduino MCUboot boards: STM32H7 like the H7 Plus but with ONBOARD cyw4343 wifi
              # instead of a WINC1500 shield -- the control for the H7 Plus watchdog reset loop.
              {"board": "ARDUINO_NICLA_VISION", "network": "wifi", "label": "board-arduino-nicla"},
              {"board": "ARDUINO_PORTENTA_H7", "network": "wifi", "label": "board-arduino-portenta"},
          ]
          board = os.environ.get("BOARD") or "all"
          # PR gate runs EVERY board including the AE3 (wifi): its USB/DFU flashing and its watchdog are
          # sorted (standard OTA + watchdog both pass on HW). To keep the AE3's flakier DFU off the
          # critical path of every PR, its PR suite is REDUCED to its two board-specific paths (delta +
          # watchdog) in regression_scenarios() -- so it adds ~2 DFU cycles, not the full tamper set.
          # coproc stays out (AE3 MRAM-write crash). workflow_dispatch still honours an explicit board.
          if os.environ.get("EVENT") == "pull_request" or board == "all":
              sel = legs
          else:
              sel = [l for l in legs if l["board"] == board]
          print("matrix=" + json.dumps({"include": sel}))
          PY

  ota-cycle:
    name: ota-cycle ${{ matrix.board }} ${{ matrix.network }}
    needs: [changes, plan]
    if: needs.changes.outputs.device == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: [self-hosted, hil, "${{ matrix.label }}"]
    # One board at a time; never cancel a running flash/cycle.
    concurrency:
      group: hil-ota-${{ matrix.label }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: OTA scenario(s) + coverage traces
        env:
          # No OTA_SERVER / OTA_TOKEN: each run spins up its OWN update server (ci/hil/bench_server)
          # on the node's IP with a throwaway store + a self-generated token -- rigs are
          # self-contained, so no shared-server address or admin token is a repo secret anymore.
          WIFI_SSID: ${{ secrets.HIL_WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.HIL_WIFI_PASSWORD }}
        run: |
          # Provision the RUNNER-OWNED OTA tooling (venv, firmware, project, SDK, J-Link), cached
          # under $HOME. Disposable nodes carry no bench state -- they self-provision here; a
          # reimage wipes the cache and the next run rebuilds it. Emits OTA_VENV/PROJECT_DIR/etc.
          eval "$(bash ci/hil/provision.sh "${{ matrix.board }}" "$GITHUB_WORKSPACE")"
          # 'all' -> this board+network's regression list; else the single chosen scenario. Run
          # each in turn (one trace apiece); don't stop on a failure, so one bad scenario doesn't
          # hide the rest -- the coverage job folds every trace and the step still reports failure.
          PY="$OTA_VENV/bin/python"
          SC="${{ github.event.inputs.scenario || 'all' }}"
          if [ "$SC" = "all" ]; then
            SCENARIOS=$("$PY" ci/hil/ota_cycle.py --board "${{ matrix.board }}" \
                        --network "${{ matrix.network }}" --list-regression)
          else
            SCENARIOS="$SC"
          fi
          echo "regression legs: $SCENARIOS"
          rc=0
          for sc in $SCENARIOS; do
            echo "::group::$sc"
            "$PY" ci/hil/ota_cycle.py \
              --board "${{ matrix.board }}" --network "${{ matrix.network }}" \
              --scenario "$sc" --target "${{ github.event.inputs.target || '1.1.0' }}" \
              --checkout "$GITHUB_WORKSPACE" \
              --trace "hil-trace-${{ matrix.board }}-${{ matrix.network }}-$sc.json" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-traces-${{ matrix.board }}-${{ matrix.network }}
          path: hil-trace-*.json

  # Fold every trace this run produced into a device-path coverage report + lcov. Runs on a
  # hosted runner (pure JSON+source processing, no hardware) after the bench jobs finish.
  coverage:
    name: device-path coverage
    needs: [changes, ota-cycle]
    if: always() && needs.changes.outputs.device == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # Matches the per-leg upload artifacts named `hil-traces-<board>-<network>` above.
          # (`hil-trace-*` silently matched none -- the artifact is `hil-traceS-`, no dash --
          # so the fold saw 0 traces and the hil flag got an empty report.)
          pattern: hil-traces-*
          path: traces
          merge-multiple: true
      - name: Build HIL coverage report
        run: |
          # coverage.py provides the arc graph the dominator back-fill needs (device paths ->
          # the whole proven line set, not just the marker lines). Absent, it degrades to
          # marker-lines-only, so it's a soft dep.
          pip install coverage
          python3 ci/hil/hil_coverage.py --traces traces \
            --md hil-coverage.md --lcov hil-coverage.info
          cat hil-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: OTA efficiency metrics -> run summary
        run: |
          # The REAL cost of an update, measured on hardware: download bytes (manifest/full/delta),
          # the delta-vs-full saving (the headline), and install time. A tracked selling-point number.
          python3 ci/hil/ota_metrics.py --traces traces --md ota-metrics.md --json ota-metrics.json
          cat ota-metrics.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HIL coverage to Codecov (flag=hil, informational + carryforward)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: hil-coverage.info
          flags: hil
          disable_search: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: hil-coverage
          path: |
            hil-coverage.md
            hil-coverage.info
            ota-metrics.md
            ota-metrics.json

  # THE REQUIRED CHECK. Always runs (hosted, seconds), so it's a status that exists on every PR --
  # mark THIS one required in branch protection. It passes a non-device PR (nothing to test) and,
  # for a device PR, passes only if every bench leg succeeded. A skipped/failed/cancelled ota-cycle
  # on a device PR fails the gate, so a broken OTA change (or a leg that never ran) can't merge.
  hil-gate:
    name: HIL gate
    needs: [changes, ota-cycle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate the HIL result
        env:
          DEVICE: ${{ needs.changes.outputs.device }}
          RESULT: ${{ needs.ota-cycle.result }}
        run: |
          if [ "$DEVICE" != "true" ]; then
            echo "No OTA-touching changes in this PR -- HIL not required. PASS."
            exit 0
          fi
          echo "OTA-touching PR; ota-cycle result = '$RESULT'."
          if [ "$RESULT" = "success" ]; then
            echo "All HIL bench legs passed. PASS."
            exit 0
          fi
          echo "HIL did not pass (ota-cycle='$RESULT'). Blocking the merge."
          exit 1
