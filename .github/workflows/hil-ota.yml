name: HIL OTA cycle

# The live-hardware OTA gate: provision a golden board from this ref, exercise an OTA
# SCENARIO (happy install/trial/confirm/promote, or a negative path -- corrupt, rollback,
# bad signature), and verify the device behaves, capturing the coverage markers off the
# board's P4/P5 UART. A second job folds the traces into a device-path coverage report --
# coverage on the lines the host suite structurally can't reach (they need real flash).
#
# Manual-trigger ONLY while the harness is in development -- it runs on the bench and each
# board cycle is minutes (the AE3's OSPI flash alone is ~10). This will become the required
# gate for OTA-touching PRs once the path matrix is built out.
on:
  workflow_dispatch:
    inputs:
      board:
        description: which board to run (or all)
        default: all
        type: choice
        options: [all, OPENMV_N6, OPENMV_AE3, OPENMV_RT1060]
      scenario:
        description: which OTA path to exercise ('all' = each board's full regression)
        default: all
        type: choice
        # Every run spins up its OWN co-located server (ci/hil/bench_server), so the tamper
        # scenarios run on any board -- no board restriction. 'all' expands per board (the
        # AE3 adds coproc/coproc_skip; block-device boards add no_slot; secondary nets = delta).
        options: [all, delta, full, corrupt, rollback, bad_sig, bad_key, bad_version, no_slot, coproc, coproc_skip]
      target:
        description: update version to install over golden 1.0.0
        default: "1.1.0"

concurrency:
  group: hil-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve which board/network legs to run from the `board` input. A job-level `if` can't see
  # `matrix` (that context isn't available there -- it was an invalid-workflow error), and a
  # static matrix can't be filtered inline, so build the matrix here and feed it via fromJSON.
  plan:
    name: plan legs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.f.outputs.matrix }}
    steps:
      - id: f
        env:
          BOARD: ${{ github.event.inputs.board }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          # The N6 and RT1062 have both interfaces, so each runs twice (lan + wifi). The RT1062
          # is the block-device (mimxrt) model, provisioned via blhost (machine.bootloader ->
          # resident SBL); its runner label is board-openmv-rt1062 (RT1062 silicon), as in ci.yml.
          legs = [
              {"board": "OPENMV_N6", "network": "lan", "label": "board-openmv-n6"},
              {"board": "OPENMV_N6", "network": "wifi", "label": "board-openmv-n6"},
              {"board": "OPENMV_AE3", "network": "wifi", "label": "board-openmv-ae3"},
              {"board": "OPENMV_RT1060", "network": "lan", "label": "board-openmv-rt1062"},
              {"board": "OPENMV_RT1060", "network": "wifi", "label": "board-openmv-rt1062"},
          ]
          board = os.environ.get("BOARD") or "all"
          sel = legs if board == "all" else [l for l in legs if l["board"] == board]
          print("matrix=" + json.dumps({"include": sel}))
          PY

  ota-cycle:
    name: ota-cycle ${{ matrix.board }} ${{ matrix.network }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: [self-hosted, hil, "${{ matrix.label }}"]
    # One board at a time; never cancel a running flash/cycle.
    concurrency:
      group: hil-ota-${{ matrix.label }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: OTA scenario(s) + coverage traces
        env:
          # No OTA_SERVER / OTA_TOKEN: each run spins up its OWN update server (ci/hil/bench_server)
          # on the node's IP with a throwaway store + a self-generated token -- rigs are
          # self-contained, so no shared-server address or admin token is a repo secret anymore.
          # The bench tooling (ota-venv, SDK, project) lives in a dedicated user's home; the
          # self-hosted runner runs as `runner` (a member of that user's group, so it can read it)
          # with a DIFFERENT $HOME -- so point every tool path at the tooling home (repo var
          # HIL_HOME, default /home/hil) and leave $HOME under the runner so caches stay writable.
          HIL_HOME: ${{ vars.HIL_HOME }}
          WIFI_SSID: ${{ secrets.HIL_WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.HIL_WIFI_PASSWORD }}
        run: |
          # 'all' -> this board+network's regression list; else the single chosen scenario. Run
          # each in turn (one trace apiece); don't stop on a failure, so one bad scenario doesn't
          # hide the rest -- the coverage job folds every trace and the step still reports failure.
          T="${HIL_HOME:-/home/hil}"
          export OTA_VENV="$T/ota-venv" SDK_HOME="$T/openmv-sdk-1.6.0" PROJECT_DIR="$T/proj"
          export JLINK="$T/jlink/JLinkExe" DFU_UTIL="$T/openmv-sdk-1.6.0/bin/dfu-util"
          export BLHOST="$T/openmv-sdk-1.6.0/python/bin/blhost"
          PY="$OTA_VENV/bin/python"
          # The firmware tree + project live under $T (owned by another user); the runner shares
          # its group but git refuses cross-owner repos ("dubious ownership") -> trust the bench
          # tooling dirs for this runner (safe: they're the bench's own trees, not user content).
          git config --global --add safe.directory "$T/fw" || true
          git config --global --add safe.directory "$PROJECT_DIR" || true
          git config --global --add safe.directory '*' || true
          SC="${{ github.event.inputs.scenario || 'all' }}"
          if [ "$SC" = "all" ]; then
            SCENARIOS=$("$PY" ci/hil/ota_cycle.py --board "${{ matrix.board }}" \
                        --network "${{ matrix.network }}" --list-regression)
          else
            SCENARIOS="$SC"
          fi
          echo "regression legs: $SCENARIOS"
          rc=0
          for sc in $SCENARIOS; do
            echo "::group::$sc"
            "$PY" ci/hil/ota_cycle.py \
              --board "${{ matrix.board }}" --network "${{ matrix.network }}" \
              --scenario "$sc" --target "${{ github.event.inputs.target || '1.1.0' }}" \
              --checkout "$GITHUB_WORKSPACE" \
              --trace "hil-trace-${{ matrix.board }}-${{ matrix.network }}-$sc.json" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-traces-${{ matrix.board }}-${{ matrix.network }}
          path: hil-trace-*.json

  # Fold every trace this run produced into a device-path coverage report + lcov. Runs on a
  # hosted runner (pure JSON+source processing, no hardware) after the bench jobs finish.
  coverage:
    name: device-path coverage
    needs: ota-cycle
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hil-trace-*
          path: traces
          merge-multiple: true
      - name: Build HIL coverage report
        run: |
          # coverage.py provides the arc graph the dominator back-fill needs (device paths ->
          # the whole proven line set, not just the marker lines). Absent, it degrades to
          # marker-lines-only, so it's a soft dep.
          pip install coverage
          python3 ci/hil/hil_coverage.py --traces traces \
            --md hil-coverage.md --lcov hil-coverage.info
          cat hil-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HIL coverage to Codecov (flag=hil, informational + carryforward)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: hil-coverage.info
          flags: hil
          disable_search: true
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: hil-coverage
          path: |
            hil-coverage.md
            hil-coverage.info
