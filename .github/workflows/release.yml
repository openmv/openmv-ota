# Publish to PyPI when a version tag is pushed (vX.Y.Z, matching pyproject's version).
#
# Trusted publishing: PyPI trusts this repository + workflow + the `pypi` environment through
# GitHub's OIDC token, so no API token is stored anywhere. The build job has no publishing
# rights; only the publish job, which runs nothing but the official action on the built files,
# can mint the short-lived upload credential.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build + check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - name: The wheel installs and runs in a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/openmv-ota --help > /dev/null
          /tmp/clean/bin/python -c "import openmv_ota.build.device.openmv_cloud, openmv_ota.server"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing: the OIDC token PyPI exchanges for an upload credential
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
