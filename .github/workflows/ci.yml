name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# openmv latest. Set to a tag/40-char SHA to pin the firmware for reproducibility.
env:
  OPENMV_REF: master

# Least privilege: every job reads; a job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Unit tests + 100% coverage gate, on Linux and macOS.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install (editable, with dev + server extras)
        # the server/ + client/ code is un-omitted from coverage, so its deps (fastapi, httpx,
        # pydantic-settings) must be importable for the 100% gate.
        run: pip install -e ".[dev,server]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest enforces --cov-fail-under=100)
        run: pytest --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.os }}

      # Record the base this PR's merge ref was built from, so the push that MERGES it can tell
      # whether its tree is the one this run already built and tested (see `premerged`). The run
      # API forgets a PR's base once it merges, so it has to be written down here.
      - name: Record the tested base (PRs)
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: echo "${{ github.event.pull_request.base.sha }}" > tested-base.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        with:
          name: tested-base
          path: tested-base.txt
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 1a) Known-vulnerable dependencies: pip-audit over everything a deployed server or a signer
  #     backend installs (OSV + PyPI advisories). A hit fails the run; bump the floor in
  #     pyproject.toml, or, for a finding that can't apply, --ignore-vuln it here with the reason.
  # ---------------------------------------------------------------------------
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the server + signer dependency set
        run: |
          python -m pip install -U pip pip-audit
          pip install -e ".[server,server-s3,server-postgres,gcp-kms,aws-kms,azure-kms]"
      - name: Audit
        run: pip-audit --skip-editable

  # ---------------------------------------------------------------------------
  # 1b) The metadata store against a REAL Postgres (production's backend), with the real
  #     connection pool. The main suite runs on SQLite, which cannot see SQL only one dialect
  #     accepts (INSERT OR REPLACE failed every new advisory on the production store) or races
  #     between pooled connections. Service containers are Linux-only, hence its own job.
  # ---------------------------------------------------------------------------
  postgres:
    name: metastore on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ota
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPENMV_OTA_PG_DSN: postgresql://postgres:ota@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install (server + postgres extras)
        run: pip install -e ".[dev,server,server-postgres]"
      - name: Real-Postgres store tests (pool, dialect, concurrency)
        run: pytest -o addopts="" -q tests/server/test_metastore_postgres.py

  # ---------------------------------------------------------------------------
  # 1c) The GCP KMS signer against the REAL Cloud KMS service. Keyless: GitHub's OIDC token is
  #     traded for short-lived Google credentials (workload identity federation, restricted to this
  #     repository), and the service account can only sign with one throwaway test key -- so no
  #     secret is stored anywhere; the identifiers it needs are repository SECRETS (unset -> the job
  #     reports "not configured" and passes). Fork PRs get no OIDC token, so they skip too.
  # ---------------------------------------------------------------------------
  gcp-kms:
    name: signer on real GCP KMS
    # Fork PRs get neither secrets nor an OIDC token.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Secrets cannot gate a job's `if:`, so the job reads them here and gates its steps.
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      OPENMV_OTA_GCP_KEY_VERSION: ${{ secrets.GCP_KMS_KEY_VERSION }}
    steps:
      - name: Configured?
        id: cfg
        run: |
          if [ -n "$GCP_WIF_PROVIDER" ] && [ -n "$OPENMV_OTA_GCP_KEY_VERSION" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GCP KMS live job not configured (repository secrets unset) -- skipped"
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: steps.cfg.outputs.on == 'true'
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2.1.13
        if: steps.cfg.outputs.on == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: steps.cfg.outputs.on == 'true'
        with:
          python-version: "3.12"
      - name: Install (gcp-kms extra)
        if: steps.cfg.outputs.on == 'true'
        run: pip install -e ".[dev,gcp-kms]"
      - name: Live signing pass (must RUN, not skip)
        if: steps.cfg.outputs.on == 'true'
        run: |
          pytest -o addopts="" -q -rs tests/ota/test_signer_gcp_live.py | tee out.txt
          grep -q "1 passed" out.txt

  # ---------------------------------------------------------------------------
  # 1d) The AWS KMS signer against the REAL KMS service, keyless like 1c: GitHub's OIDC token
  #     assumes a role that trusts only this repository and can only sign with one test key.
  #     Needs repository SECRETS AWS_CI_ROLE_ARN + AWS_KMS_KEY_ARN (unset -> "not configured").
  # ---------------------------------------------------------------------------
  aws-kms:
    name: signer on real AWS KMS
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_CI_ROLE_ARN: ${{ secrets.AWS_CI_ROLE_ARN }}
      OPENMV_OTA_AWS_KEY_ARN: ${{ secrets.AWS_KMS_KEY_ARN }}
    steps:
      - name: Configured?
        id: cfg
        run: |
          if [ -n "$AWS_CI_ROLE_ARN" ] && [ -n "$OPENMV_OTA_AWS_KEY_ARN" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
            echo "region=$(echo "$OPENMV_OTA_AWS_KEY_ARN" | cut -d: -f4)" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AWS KMS live job not configured (repository secrets unset) -- skipped"
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: steps.cfg.outputs.on == 'true'
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        if: steps.cfg.outputs.on == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ steps.cfg.outputs.region }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: steps.cfg.outputs.on == 'true'
        with:
          python-version: "3.12"
      - name: Install (aws-kms extra)
        if: steps.cfg.outputs.on == 'true'
        run: pip install -e ".[dev,aws-kms]"
      - name: Live signing pass (must RUN, not skip)
        if: steps.cfg.outputs.on == 'true'
        run: |
          pytest -o addopts="" -q -rs tests/ota/test_signer_aws_live.py | tee out.txt
          grep -q "1 passed" out.txt

  # ---------------------------------------------------------------------------
  # 1a) Was this push already tested as a PR? A squash merge of PR head H onto base B is the
  #     same tree as the refs/pull/N/merge the PR's CI built -- IF B is still main's tip. So on a
  #     push, find the merged PR, take the last SUCCESSFUL pull_request run of its head, and
  #     compare the base it recorded with this commit's parent. Equal -> the firmware builds and
  #     QEMU already passed on this exact tree; skip them (the host tests still run, for the
  #     Codecov base report). Anything else -- a direct push, main moved in between, a missing
  #     artifact, an API error -- runs everything. This job never fails: a failed `needs` would
  #     skip the builds, which is the one outcome it must not cause.
  # ---------------------------------------------------------------------------
  premerged:
    name: already tested as a PR?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          if [ "$EVENT" = push ]; then
            pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                   -q '[.[] | select(.merged_at != null)][0].number' 2>/dev/null || true)
            if [ -n "$pr" ]; then
              head=$(gh api "repos/$REPO/pulls/$pr" -q .head.sha 2>/dev/null || true)
              run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$head&per_page=1" \
                      -q '.workflow_runs[0].id' 2>/dev/null || true)
              parent=$(gh api "repos/$REPO/commits/$SHA" -q '.parents[0].sha' 2>/dev/null || true)
              if [ -n "$run" ] && gh run download "$run" --repo "$REPO" -n tested-base -D tb 2>/dev/null; then
                base=$(cat tb/tested-base.txt 2>/dev/null || true)
                echo "PR #$pr head=$head run=$run tested-base=$base parent=$parent"
                [ -n "$base" ] && [ "$base" = "$parent" ] && skip=true
              else
                echo "PR #$pr: no successful PR run with a recorded base -- running everything"
              fi
            else
              echo "not a PR merge (direct push) -- running everything"
            fi
          fi
          echo "skip=$skip"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 1b) The ECDSA verify C shim, compiled against the firmware's own mbedtls and
  #     exercised on the host (host signs / mbedtls verifies + gcov 100% of core).
  #     Needs only the mbedtls source, so it fetches that submodule chain, not the
  #     whole firmware. Crypto is OS-independent, so Linux is enough.
  # ---------------------------------------------------------------------------
  cshim:
    name: ecdsa C shim (host mbedtls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Fetch the firmware's mbedtls source
        run: |
          git clone --depth 1 https://github.com/openmv/openmv.git "$RUNNER_TEMP/openmv"
          git -C "$RUNNER_TEMP/openmv" submodule update --init lib/micropython
          # --recursive: mbedtls 3.6 generates sources (psa_crypto_driver_wrappers.h)
          # via its own `framework` submodule, so a non-recursive init can't build.
          git -C "$RUNNER_TEMP/openmv/lib/micropython" submodule update --init --recursive lib/mbedtls
          # The source generation needs jinja2 + jsonschema; install mbedtls's own
          # authoritative build requirements rather than guessing package names.
          pip install -r "$RUNNER_TEMP/openmv/lib/micropython/lib/mbedtls/scripts/basic.requirements.txt"

      - name: Run the C-shim test (mbedtls + gcov)
        env:
          OPENMV_FW: ${{ runner.temp }}/openmv
        run: pytest tests/build/test_ecdsa_verify_c.py -o addopts="" -q

  # ---------------------------------------------------------------------------
  # 1c) Run the real boot.py on actual MicroPython under QEMU (MPS2-AN500):
  #     every boot path (each reject reason + valid) plus the real vfs.rom_ioctl
  #     mount + A/B slot selection. This covers what host tests can't --
  #     boot.py on MicroPython and the on-device mount. (mbedtls isn't built for
  #     the qemu port yet, so the signature step uses an injected verify; the
  #     ECDSA C core is covered by the 100%-gcov host test above.)
  # ---------------------------------------------------------------------------
  qemu:
    name: boot.py on MicroPython (QEMU)
    needs: premerged
    if: needs.premerged.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install openmv-ota + mpremote deps
        run: pip install -e ".[dev]" pyserial platformdirs

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm

      - name: Check out openmv firmware (latest) + direct submodules
        run: |
          git clone https://github.com/openmv/openmv.git "$RUNNER_TEMP/openmv"
          git -C "$RUNNER_TEMP/openmv" checkout "$OPENMV_REF"
          # Direct submodules only, shallow -- openmv's, then micropython's
          # (mbedtls / lwip / tinyusb / ... are micropython's DIRECT submodules,
          # which is what the firmware build needs). NOT --recursive, which also
          # pulls every port's nested tree. Mirrors openmv's own tools/ci.sh
          # ci_update_submodules exactly, so it's what their firmware CI builds on.
          git -C "$RUNNER_TEMP/openmv" submodule update --init --depth=1 --no-single-branch
          git -C "$RUNNER_TEMP/openmv/lib/micropython" submodule update --init --depth=1

      - name: Use the SDK's bundled make
        run: |
          SDK_VERSION="$(cat "$RUNNER_TEMP/openmv/SDK_VERSION")"
          echo "$HOME/openmv-sdk-$SDK_VERSION/make" >> "$GITHUB_PATH"

      - name: Build the MPS2_AN500 + MPS3_AN547 firmware (the tool installs the SDK)
        run: |
          openmv-ota project new "$RUNNER_TEMP/mps" -f "$RUNNER_TEMP/openmv" \
            -b MPS2_AN500 -b MPS3_AN547 --install-sdk
          openmv-ota build firmware "$RUNNER_TEMP/mps" -b MPS2_AN500
          openmv-ota build firmware "$RUNNER_TEMP/mps" -b MPS3_AN547

      - name: Run the QEMU boot test (both emulator boards)
        run: python ci/qemu_boot_test.py --firmware "$RUNNER_TEMP/openmv"

  # ---------------------------------------------------------------------------
  # 2) Exercise the tool end to end on every board (Linux only):
  #    `project new` pegs the project, `--install-sdk` fetches the OpenMV SDK
  #    (pure-Python download), and the firmware build uses the toolchain bundled
  #    *inside that SDK* -- no external arm-gcc / make is installed here. Boards
  #    the tool can't serve must fail cleanly (asserted by the driver).
  #
  #    macOS board builds are disabled: a full 13-board matrix on macOS runners
  #    is ~an hour of the slowest jobs in the run, for little marginal signal
  #    (the macOS host CLI is already covered by the `test` job above; the SDK's
  #    bundled toolchain is the same download on both OSes). Re-enable behind a
  #    scheduled/regression workflow if a macOS-only build break ever surfaces.
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.board }}
    needs: [test, premerged]
    if: needs.premerged.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - OPENMV2
          - OPENMV3
          - OPENMV4
          - OPENMV4P
          - OPENMVPT
          - OPENMV_RT1060
          - OPENMV_AE3
          - OPENMV_N6
          - ARDUINO_PORTENTA_H7
          - ARDUINO_GIGA
          - ARDUINO_NICLA_VISION
          - ARDUINO_NANO_33_BLE_SENSE
          - ARDUINO_NANO_RP2040_CONNECT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install openmv-ota
        run: pip install -e .

      - name: Check out openmv firmware (latest) + submodules
        run: |
          git clone https://github.com/openmv/openmv.git "$RUNNER_TEMP/openmv"
          git -C "$RUNNER_TEMP/openmv" checkout "$OPENMV_REF"
          # Direct submodules only, shallow (openmv's, then micropython's own --
          # mbedtls/lwip/tinyusb/... are micropython's direct submodules). NOT
          # --recursive, which also pulls every port's nested tree for nothing.
          # Mirrors openmv's tools/ci.sh ci_update_submodules.
          git -C "$RUNNER_TEMP/openmv" submodule update --init --depth=1 --no-single-branch
          git -C "$RUNNER_TEMP/openmv/lib/micropython" submodule update --init --depth=1

      - name: Use the SDK's bundled toolchain
        run: |
          # The firmware Makefile prepends the SDK's gcc / vela / stedgeai /
          # signing-tool dirs to PATH itself; only the top-level `make` it shells
          # out to needs finding here, so add the SDK's bundled make. The SDK is
          # installed by `project new --install-sdk` in the next step (a PATH
          # entry for a dir that exists by the time make runs is fine).
          SDK_VERSION="$(cat "$RUNNER_TEMP/openmv/SDK_VERSION")"
          echo "$HOME/openmv-sdk-$SDK_VERSION/make" >> "$GITHUB_PATH"

      - name: Build + verify ${{ matrix.board }} (tool installs the SDK)
        env:
          INSTALL_SDK: "1"
          WORKDIR: ${{ runner.temp }}/projects
        run: bash ci/build_boards.sh "$RUNNER_TEMP/openmv" "${{ matrix.board }}"

      - name: CVE-scan the SBOM (osv-scanner)
        if: matrix.board == 'OPENMV_N6'
        run: |
          curl -sSL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner
          # Scans the purl-identified components: the pinned firmware commit, the
          # pypi tools, and every github-hosted submodule at its exact commit
          # (the lock records each submodule's remote).
          osv-scanner -L "$RUNNER_TEMP/projects/OPENMV_N6/ota/build/sbom.cdx.json"

  # ---------------------------------------------------------------------------
  # 3) Hardware-in-the-loop (first milestone: build on the real board's runner).
  #    Gated on `build`, so the bench only runs AFTER every board build is green --
  #    the HIL jobs launch once the build matrix finishes (not alongside it), so a
  #    broken build never reaches the hardware and the two don't contend. Limited to
  #    main pushes + manual dispatch so pull requests don't tie up the hardware.
  #
  #    Each board maps to its self-hosted runner by label (the bench lives behind
  #    a NAT on Tailscale; runners poll out). This milestone proves the node can
  #    install the toolchain (the SDK, userspace -- no root on these runners) and
  #    compile the OTA firmware on the board's own machine. Flashing over the
  #    attached J-Link and the on-device checks build on top of this next; when
  #    they land, HIL moves to its own workflow so a new push can't cancel a job
  #    mid-flash (this workflow's concurrency cancels in progress).
  # ---------------------------------------------------------------------------
  hil:
    name: hil ${{ matrix.board }}
    needs: build
    # MANUAL ONLY. This used to also run on every push to main, which meant every MERGE
    # grabbed the AE3, the N6 and the RT1060 to rebuild firmware they had already proven --
    # the real gate is hil-ota.yml, which runs the full regression on the PR, i.e. BEFORE the
    # merge. Re-running a build on the bench afterwards proves nothing new and takes the
    # boards away from the next PR's gate (and from anyone at the bench). Dispatch it by hand
    # when you actually want a firmware build on the board's own runner.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: OPENMV_AE3
            label: board-openmv-ae3      # runner openmv-ae3-pag7936
          - board: OPENMV_N6
            label: board-openmv-n6       # runner openmv-n6-pag7936
          - board: OPENMV_RT1060
            label: board-openmv-rt1062   # runner openmv-rt1060-ov5640 (RT1062 silicon)
    runs-on: [self-hosted, hil, "${{ matrix.label }}"]
    # Serialize per physical board and never cancel a running bench job.
    concurrency:
      group: hil-${{ matrix.label }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # The nodes ship system python3.12; use a throwaway venv in RUNNER_TEMP
      # (wiped per job) so a job never pollutes the shared interpreter.
      - name: Install openmv-ota (venv)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -e .
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Check out openmv firmware + submodules
        run: |
          git clone https://github.com/openmv/openmv.git "$RUNNER_TEMP/openmv"
          git -C "$RUNNER_TEMP/openmv" checkout "$OPENMV_REF"
          # Direct submodules only, shallow (openmv's, then micropython's own --
          # mbedtls/lwip/tinyusb/... are micropython's direct submodules). NOT
          # --recursive, which also pulls every port's nested tree. Mirrors
          # openmv's tools/ci.sh ci_update_submodules.
          git -C "$RUNNER_TEMP/openmv" submodule update --init --depth=1 --no-single-branch
          git -C "$RUNNER_TEMP/openmv/lib/micropython" submodule update --init --depth=1

      - name: Use the SDK's bundled make
        run: |
          SDK_VERSION="$(cat "$RUNNER_TEMP/openmv/SDK_VERSION")"
          echo "$HOME/openmv-sdk-$SDK_VERSION/make" >> "$GITHUB_PATH"

      - name: Build + verify the OTA firmware on the board's own runner
        env:
          INSTALL_SDK: "1"
          WORKDIR: ${{ runner.temp }}/projects
        run: bash ci/build_boards.sh "$RUNNER_TEMP/openmv" "${{ matrix.board }}"
