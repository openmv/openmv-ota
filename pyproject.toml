[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmv-ota"
version = "1.0.0"
description = "Secure over-the-air update tooling for OpenMV cameras (ROMFS OTA, with room for firmware/bootloader OTA)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenMV", email = "openmv@openmv.io" }]
keywords = ["openmv", "ota", "romfs", "firmware", "update", "ecdsa", "embedded"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Security :: Cryptography",
]

# Runtime dependencies are added as each tool is built out (see the plan):
#   server:   a web framework + object-storage adapters
#   sbom/cve: cyclonedx, osv/nvd scanners
dependencies = [
    "cryptography>=42",  # ECDSA keygen + signing for OTA trailers
    "pyserial>=3.5",     # serial-port discovery + 1200-baud touch-to-reset (Arduino)
    "mpremote>=1.20",    # reset OpenMV-protocol cameras into the bootloader (machine.bootloader)
    "httpx>=0.27",       # the `client` verbs (release publish, rollouts, ...) talk to the server
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "pytest-xdist>=3", "ruff", "hypothesis>=6"]
# The update server. (`httpx`, which the client verbs and FastAPI's test client both use, is a
# base dependency: Getting started publishes with a plain `pip install openmv-ota`.)
# Heavy/optional backends are separate extras, lazily imported only when that backend is
# selected, so the base `server` install stays lean (local-disk + stdlib sqlite work out of it).
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic-settings>=2",
          "python-multipart>=0.0.9"]
server-s3 = ["boto3>=1.34"]
server-postgres = ["psycopg[binary,pool]>=3.1"]
# Signer backends: the key never lands on disk as a file. One PKCS#11 backend covers all hardware
# tokens/HSMs; the three cloud KMS providers are separate extras.
hsm = ["python-pkcs11>=0.7"]
aws-kms = ["boto3[crt]>=1.34"]
gcp-kms = ["google-cloud-kms>=2"]
azure-kms = ["azure-keyvault-keys>=4", "azure-identity>=1"]

[project.urls]
Homepage = "https://github.com/openmv/openmv-ota"
Source = "https://github.com/openmv/openmv-ota"
Issues = "https://github.com/openmv/openmv-ota/issues"

[project.scripts]
openmv-ota = "openmv_ota.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The on-device SDK ships as package data, bundled into the ROMFS at build time.
"openmv_ota" = [
    "data/*.json",
    "data/*.pem",                # the hosted OpenMV Cloud trust anchors (certs/root.pem)
    "data/firmware/**/*",
    "data/flashloaders/**/*",    # prebuilt i.MX RT sdphost/blhost flashloaders
    "data/n6_bootloader/*",      # static N6 CubeProgrammer FSBL/loader + FlashLayout.tsv
    "build/device/*.c",          # the ECDSA verify C module dropped into modules/
    "build/device/openmv_ota/data/*",  # the installer source, scaffolded into projects
    "server/deploy/*",           # Dockerfile + compose stack for self-hosters
    "server/docs_static/*",      # self-hosted /docs API reference (ReDoc bundle + logo)
    "project/compliance_templates/*",  # CRA/RED templates, scaffolded into OTA projects
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-n auto --dist worksteal --cov=openmv_ota --cov-report=term-missing --cov-fail-under=100 --import-mode=importlib"
# Default norecursedirs excludes "build"; we have a tests/build/ dir to collect.
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]

[tool.coverage.run]
source = ["openmv_ota"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# The rule set `ruff check .` is required to pass (CLAUDE.md; enforced in CI).
# Pinned explicitly so a newer ruff's expanded defaults can't repaint the repo red.
# S (bandit) and B (bugbear) are the security/bug-risk pass: a finding is fixed, or suppressed
# on its line with the reason. Only the rules below are waived wholesale, each for its reason.
select = ["E4", "E7", "E9", "F", "S", "B"]
ignore = [
    # every subprocess call passes an argv list; shell=True (S602/S604/S605) stays an error
    "S603",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a call in the default, evaluated once by design
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Header",
    "openmv_ota.server.auth.require_scope",
]

[tool.ruff.lint.per-file-ignores]
# tests assert, use fixed fake secrets and throwaway paths by design
"tests/**" = ["S"]
# MicroPython has no zip(strict=) and no exception chaining (B904/B905); the survival
# paths (logging, watchdog, RTC, spool replay) must never raise and cannot afford to log
# the failure they are already handling (S110/S112)
"src/openmv_ota/build/device/**" = ["B904", "B905", "S110", "S112"]
# the bench harness drives tools found on the runner's PATH (mpremote, dfu-util, JLinkExe),
# and tears it down best-effort; its only URL reads are its own localhost bench server
"ci/**" = ["S607", "S110", "S310"]
# every value is a bound parameter; the only interpolated text is a column or table name
# from a code-side whitelist (_order, the constant table tuples, _updatable's allow-lists)
"src/openmv_ota/server/metastore.py" = ["S608"]
