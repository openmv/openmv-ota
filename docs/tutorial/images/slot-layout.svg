<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 538" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg    { fill: #ffffff; }
    .t     { fill: #1f2430; }
    .bar   { fill: #333b49; }
    .barw  { fill: #545d6e; font-size: 10px; }
    .sub   { fill: #545d6e; font-size: 12px; }
    .who   { fill: #545d6e; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
    .code  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .seg   { stroke: #9aa3af; stroke-width: 1.2; }
    .zoom  { stroke: #9aa3af; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #14181f; }
      .t    { fill: #e6e9f0; }
      .sub  { fill: #9aa5ba; }
      .who  { fill: #c3cede; }
      .seg  { stroke: #59637a; }
      .zoom { stroke: #59637a; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="100%" height="100%" rx="10"/>

  <!-- the partition -->
  <text class="who" x="40" y="20">OTA PARTITION</text>
  <text class="sub" x="820" y="20" text-anchor="end">single-image mode: one slot spans the partition, same two sectors</text>
  <rect class="seg" x="40" y="28" width="390" height="40" fill="#dbe4f0"/>
  <rect class="seg" x="430" y="28" width="390" height="40" fill="#e6ddf0"/>
  <text class="bar" x="235" y="53" text-anchor="middle">slot A — image + control sectors</text>
  <text class="bar" x="625" y="53" text-anchor="middle">slot B — same shape</text>

  <!-- zoom into slot A -->
  <path class="zoom" d="M40 68 L40 118"/>
  <path class="zoom" d="M430 68 L820 118"/>

  <!-- slot A, zoomed -->
  <rect class="seg" x="40"  y="118" width="570" height="44" fill="#dbe4f0"/>
  <rect class="seg" x="610" y="118" width="90"  height="44" fill="#eef1f5"/>
  <rect class="seg" x="700" y="118" width="60"  height="44" fill="#f5e3bd"/>
  <rect class="seg" x="760" y="118" width="60"  height="44" fill="#c8e8d2"/>
  <text class="bar" x="325" y="144" text-anchor="middle">image body</text>
  <text class="bar" x="655" y="144" text-anchor="middle" font-size="12"><tspan class="code">0xFF</tspan> pad</text>
  <text class="bar" x="730" y="144" text-anchor="middle" font-size="12">status</text>
  <text class="bar" x="790" y="144" text-anchor="middle" font-size="12">trailer</text>
  <text class="sub" x="40" y="180">two control sectors, 4 KiB each, at the slot's end</text>

  <!-- zoom into the status sector -->
  <path class="zoom" d="M700 162 L40 218"/>
  <path class="zoom" d="M760 162 L820 218"/>

  <!-- the status sector, zoomed (not to scale): markers row, then records row -->
  <text class="sub" x="40"  y="212" font-size="10">0</text>
  <text class="sub" x="235" y="212" font-size="10">16</text>
  <text class="sub" x="430" y="212" font-size="10">32</text>
  <text class="sub" x="625" y="212" font-size="10">48</text>
  <rect class="seg" x="40"  y="218" width="195" height="52" fill="#f5e3bd"/>
  <rect class="seg" x="235" y="218" width="195" height="52" fill="#f9edd2"/>
  <rect class="seg" x="430" y="218" width="195" height="52" fill="#f5e3bd"/>
  <rect class="seg" x="625" y="218" width="195" height="52" fill="#f9edd2"/>
  <text class="bar" x="137" y="240" text-anchor="middle"><tspan class="code">pending</tspan></text>
  <text class="barw" x="137" y="258" text-anchor="middle">set by the updater</text>
  <text class="bar" x="332" y="240" text-anchor="middle"><tspan class="code">tried</tspan></text>
  <text class="barw" x="332" y="258" text-anchor="middle">informational</text>
  <text class="bar" x="527" y="240" text-anchor="middle"><tspan class="code">confirmed</tspan></text>
  <text class="barw" x="527" y="258" text-anchor="middle">set by confirm()</text>
  <text class="bar" x="722" y="240" text-anchor="middle">representation</text>
  <text class="barw" x="722" y="258" text-anchor="middle">full | delta</text>

  <text class="sub" x="40"  y="288" font-size="10">64</text>
  <text class="sub" x="235" y="288" font-size="10">80</text>
  <text class="sub" x="430" y="288" font-size="10">+1 KiB</text>
  <rect class="seg" x="40"  y="294" width="195" height="52" fill="#f5e3bd"/>
  <rect class="seg" x="235" y="294" width="195" height="52" fill="#f9edd2"/>
  <rect class="seg" x="430" y="294" width="195" height="52" fill="#cfe0f5"/>
  <rect class="seg" x="625" y="294" width="195" height="52" fill="#f3f4f6"/>
  <text class="bar" x="137" y="316" text-anchor="middle">install counter</text>
  <text class="barw" x="137" y="334" text-anchor="middle"><tspan class="code" font-size="10">u32 ‖ ~u32</tspan></text>
  <text class="bar" x="332" y="316" text-anchor="middle">attempt region</text>
  <text class="barw" x="332" y="334" text-anchor="middle">one marker per trial boot</text>
  <text class="bar" x="527" y="316" text-anchor="middle">floor</text>
  <text class="barw" x="527" y="334" text-anchor="middle">carried at install, raised at confirm()</text>
  <text class="bar" x="722" y="316" text-anchor="middle">…blank</text>
  <text class="barw" x="722" y="334" text-anchor="middle">0xFF to the sector's end</text>

  <text class="sub" x="40" y="368">the <tspan class="code">status</tspan> sector (not to scale) — 16-byte cells, one flash write unit each (32 on flash that programs 32-byte ECC words);</text>
  <text class="sub" x="40" y="384">markers are 16-byte values; the counter and floor entries are 8 bytes each, floor entries appended;</text>
  <text class="sub" x="40" y="400">the attempt region fits 64 markers (1 KiB) — the trial limit itself is [ota].max_attempts, default 3.</text>
  <text class="sub" x="40" y="416">Every field is programmed <tspan font-style="italic">once</tspan>; only the slot erase clears it.</text>

  <!-- legend -->
  <rect class="seg" x="40" y="444" width="14" height="14" rx="3" fill="#c8e8d2"/>
  <text class="t" x="64" y="456"><tspan font-weight="600">trailer</tspan> — the signed identity: version, body SHA-256, signing key</text>
  <text class="who" x="64" y="472">WRITTEN AT BUILD · VERIFIED EVERY BOOT</text>

  <rect class="seg" x="40" y="488" width="14" height="14" rx="3" fill="#f5e3bd"/>
  <text class="t" x="64" y="500"><tspan font-weight="600">status</tspan> — the trial state machine + the anti-rollback floor, laid out above</text>
  <text class="who" x="64" y="516">WRITTEN BY THE UPDATER, boot.py AND confirm()</text>
</svg>
